name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository package boundary
        run: python scripts/validate_skill_package.py

      - name: Run tests
        run: pytest

      - name: Build standalone skill archive
        run: python scripts/package_skill.py

      - name: Validate standalone skill archive
        run: python scripts/validate_skill_package.py dist/prompt-architect.skill --archive
